[project]
name = "cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "core",
    "typer>=0.26.7",
]

[project.scripts]
cli = "cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]

[tool.taskipy.tasks]
build = "pyinstaller --onefile --name 3mcli src/cli/main.py"
