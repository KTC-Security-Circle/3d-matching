[project]
name = "serve"
version = "0.1.0"
description = "JSONL matching service"
requires-python = ">=3.12"
dependencies = [
    "core",
]

[project.scripts]
serve = "serve:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]

[tool.taskipy.tasks]
build = "pyinstaller --onefile --name 3mserve src/serve/main.py"
